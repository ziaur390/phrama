name: phrama_booker
description: PHRAMA field booker app — offline-first order pad for Malakand Division.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0          # API calls when online
  sqflite: ^2.3.0       # offline storage (orders/recoveries queue)
  path: ^1.9.0
  provider: ^6.1.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
